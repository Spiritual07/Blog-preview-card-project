<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <section class="card">
      <div>
        <img
          src="./assets/images/illustration-article.svg"
          alt="illustration-article"
          class="card-image"
        />
        <button class="button">Learning</button>

        <h3 class="card-subtitle">Published 21 Dec 2023</h3>

        <h1 class="card-title" tabindex="0">HTML & CSS foundations</h1>

        <p class="card-description">
          languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>

        <div class="avatar">
          <img
            src="./assets/images/image-avatar.webp"
            alt="avatar"
            class="card-avatar"
          />
          <p class="card-author">Greg Hooper</p>
        </div>
      </div>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Spiritualtechsolutions</a>.
    </footer>
  </body>
</html>
